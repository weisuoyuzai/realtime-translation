[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "live-translator"
version = "0.1.0"
description = "Real-time audio translation for Windows and macOS: per-app capture, local or remote ASR, local or remote translation"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
live-translator = "live_translator.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["live_translator*"]

[tool.setuptools.package-data]
live_translator = ["native/macos/*.swift", "ui/assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
