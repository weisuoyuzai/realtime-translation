name: Build

# Tests every push / PR, builds standalone apps for Windows, macOS and Linux, and publishes them as a GitHub Release
# when a version tag (v*) is pushed:   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      cuda:
        description: "Also build the Windows CUDA variant (bundles cuBLAS + cuDNN, about 1 GB more)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Shared libraries Qt (offscreen platform used by the tests and the smoke test) and PortAudio need on Ubuntu.
  LINUX_LIBS: >-
    libportaudio2 libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 libglib2.0-0 libpulse0
    libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0
    libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_LIBS
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests -q

  plan:
    # The CUDA variant is large, so it is built only for releases and on request.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          WITH_CUDA: ${{ inputs.cuda || startsWith(github.ref, 'refs/tags/v') }}
        run: |
          matrix='[{"name":"windows-x64","os":"windows-latest"},{"name":"macos-arm64","os":"macos-latest"},{"name":"linux-x64","os":"ubuntu-latest"}]'
          if [ "$WITH_CUDA" = "true" ]; then
            matrix=$(jq -c '. + [{"name":"windows-x64-cuda","os":"windows-latest","cuda":true}]' <<<"$matrix")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.name }})
    needs: plan
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7            # submodules (faster-whisper, jt-live-whisper) are not needed
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_LIBS
      - name: Work out the version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "LT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            base=$(sed -n 's/^version *= *"\(.*\)"/\1/p' pyproject.toml | head -1)
            echo "LT_VERSION=${base}-dev.${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi
      - name: Build, smoke-test and package
        shell: bash
        run: python scripts/build.py ${{ matrix.cuda && '--cuda' || '' }}
      - uses: actions/upload-artifact@v7
        with:
          name: LiveTranslator-${{ matrix.name }}
          path: dist/LiveTranslator-*
          if-no-files-found: error
          compression-level: 0               # already compressed (zip / dmg / tar.gz)
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: LiveTranslator-*
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -lh artifacts
          flags=""
          case "$TAG" in *-*) flags="--prerelease" ;; esac
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes $flags
          gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
